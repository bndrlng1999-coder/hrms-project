services:
  - type: web
    name: tanvox-hrms-backend
    runtime: docker
    rootDir: hrms-backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: JPA_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: JPA_DDL_AUTO
        value: update
      - key: ATTENDANCE_APPROVAL_REQUIRED
        value: "true"
      - key: CRM_SLA_NEW_LEAD_CONTACT_HOURS
        value: "4"
      - key: CRM_SLA_FOLLOW_UP_RESPONSE_HOURS
        value: "24"
      - key: CRM_SLA_SCHEDULER_DELAY_MS
        value: "300000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
