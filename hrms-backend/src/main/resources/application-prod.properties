server.port=${PORT:8080}
server.servlet.context-path=/api

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

attendance.approval.required=${ATTENDANCE_APPROVAL_REQUIRED:true}
crm.sla.new-lead-contact-hours=${CRM_SLA_NEW_LEAD_CONTACT_HOURS:4}
crm.sla.follow-up-response-hours=${CRM_SLA_FOLLOW_UP_RESPONSE_HOURS:24}
crm.sla.scheduler-delay-ms=${CRM_SLA_SCHEDULER_DELAY_MS:300000}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

logging.level.com.nikhilhrms=INFO
logging.level.com.tanvox.hrms=INFO
