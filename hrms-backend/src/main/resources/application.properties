server.port=${PORT:8080}
server.servlet.context-path=/api

# Database Configuration (PostgreSQL - Neon)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration (STRICT PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:nikhi_hrms_super_secret_key_2024_more_than_256_bits_for_hs512_algorithm_encryption}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Attendance
attendance.approval.required=${ATTENDANCE_APPROVAL_REQUIRED:true}

# CRM SLA
crm.sla.new-lead-contact-hours=${CRM_SLA_NEW_LEAD_CONTACT_HOURS:4}
crm.sla.follow-up-response-hours=${CRM_SLA_FOLLOW_UP_RESPONSE_HOURS:24}
crm.sla.scheduler-delay-ms=${CRM_SLA_SCHEDULER_DELAY_MS:300000}

# Application
spring.application.name=tanvox-hrms

# Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=tanvox-hrms

# API Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.nikhilhrms=INFO
logging.level.com.tanvox.hrms=INFO
logging.pattern.level=%5p [${spring.application.name:tanvox-hrms}]