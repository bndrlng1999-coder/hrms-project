server.port=${PORT:8080}
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/nikhil_hrms?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:111111}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:nikhi_hrms_super_secret_key_2024_more_than_256_bits_for_hs512_algorithm_encryption}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Attendance
attendance.approval.required=${ATTENDANCE_APPROVAL_REQUIRED:true}

# CRM SLA
crm.sla.new-lead-contact-hours=${CRM_SLA_NEW_LEAD_CONTACT_HOURS:4}
crm.sla.follow-up-response-hours=${CRM_SLA_FOLLOW_UP_RESPONSE_HOURS:24}
crm.sla.scheduler-delay-ms=${CRM_SLA_SCHEDULER_DELAY_MS:300000}

# Application
spring.application.name=tanvox-hrms

# Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=tanvox-hrms

# API Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Structured operational logging
logging.level.com.nikhilhrms=INFO
logging.level.com.tanvox.hrms=INFO
logging.pattern.level=%5p [${spring.application.name:tanvox-hrms}]
